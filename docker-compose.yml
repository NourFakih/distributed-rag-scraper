name: distributed-rag-scraper

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16-bookworm
    environment:
      POSTGRES_DB: distributed_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d distributed_rag
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data

  migrate:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/distributed_rag?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/distributed_rag?schema=public
      REDIS_URL: redis://redis:6379
      MODEL_CACHE_DIR: /models/cache
      EMBEDDING_ALLOW_REMOTE_MODELS: ${EMBEDDING_ALLOW_REMOTE_MODELS:-true}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-60000}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-500}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.75}
      RAG_MAX_SOURCE_CHARACTERS: ${RAG_MAX_SOURCE_CHARACTERS:-1500}
      RAG_MAX_CONTEXT_CHARACTERS: ${RAG_MAX_CONTEXT_CHARACTERS:-8000}
      CRAWLER_USER_AGENT: ${CRAWLER_USER_AGENT:-DistributedRagScraper/0.1 (+https://github.com/NourFakih/distributed-rag-scraper)}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - model-cache:/models/cache
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: packages/workers/Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/distributed_rag?schema=public
      REDIS_URL: redis://redis:6379
      MODEL_CACHE_DIR: /models/cache
      EMBEDDING_ALLOW_REMOTE_MODELS: ${EMBEDDING_ALLOW_REMOTE_MODELS:-true}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      WORKER_CONCURRENCY: 5
      CRAWLER_USER_AGENT: ${CRAWLER_USER_AGENT:-DistributedRagScraper/0.1 (+https://github.com/NourFakih/distributed-rag-scraper)}
      CRAWLER_DEFAULT_INTERVAL_MS: ${CRAWLER_DEFAULT_INTERVAL_MS:-1000}
      CRAWLER_JAVASCRIPT_NAVIGATION_TIMEOUT_MS: ${CRAWLER_JAVASCRIPT_NAVIGATION_TIMEOUT_MS:-15000}
      CRAWLER_JAVASCRIPT_SETTLE_MS: ${CRAWLER_JAVASCRIPT_SETTLE_MS:-500}
      CRAWLER_JAVASCRIPT_WAIT_SELECTOR: ${CRAWLER_JAVASCRIPT_WAIT_SELECTOR:-}
      CRAWLER_JAVASCRIPT_WAIT_SELECTOR_TIMEOUT_MS: ${CRAWLER_JAVASCRIPT_WAIT_SELECTOR_TIMEOUT_MS:-5000}
      CRAWLER_JAVASCRIPT_MAX_CONTEXTS: ${CRAWLER_JAVASCRIPT_MAX_CONTEXTS:-2}
    init: true
    shm_size: "1gb"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - model-cache:/models/cache
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "4173:80"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  model-cache:
